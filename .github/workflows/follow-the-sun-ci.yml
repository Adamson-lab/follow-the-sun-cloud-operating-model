name: Follow-the-Sun Cloud Operating Model CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-solar-routing-and-handovers:
    name: Solar Shift Router, Sovereignty Fence & Merkle Handover Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Operating Model Modules
        run: make lint
      - name: Run Unit, Continuity, Sovereignty & Merkle Tests
        run: make test
      - name: Execute Live Shift Dispatch & Verify DORA Merkle Proof
        run: make demo && make verify
